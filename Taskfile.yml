version: '3'

dotenv: ['.env']

vars:
  ENV: '{{.ENV | default "dev"}}'
  WEB_PORT: '{{.WEB_PORT | default "8080"}}'
  COMPOSE: docker compose -f compose.yaml -f compose.{{.ENV}}.yaml
  COMPOSE_TEST: docker compose -f compose.yaml -f compose.{{.ENV}}.yaml -f compose.test.yaml

tasks:
  # ─── setup ──────────────────────────────────────────────────────
  env:init:
    desc: ".env.example から .env を生成 (既存の場合はスキップ)"
    cmds:
      - |
        if [ -f .env ]; then
          echo ".env already exists, skipping"
        else
          cp .env.example .env
          echo ".env を作成しました。必要に応じて WEB_PORT 等を編集してください"
        fi

  setup:
    desc: "初回セットアップ: .env 生成 → 手順表示"
    cmds:
      - task: env:init
      - |
        echo ""
        echo "=== First-time Setup ==="
        echo ""
        echo "1. task secrets:init"
        echo "   → age キーペアと app_key を生成"
        echo ""
        echo "2. .sops.yaml を編集"
        echo "   → 表示された公開鍵を dev / prod それぞれに貼り付け"
        echo ""
        echo "3. secrets/dev/secrets.yaml を作成して編集"
        echo "   cp secrets/dev/secrets.yaml.example secrets/dev/secrets.yaml"
        echo ""
        echo "4. task secrets:encrypt"
        echo "   → secrets.enc.yaml を生成 (git にコミット可)"
        echo ""
        echo "5. task up"
        echo ""

  # ─── lifecycle ──────────────────────────────────────────────────
  up:
    desc: "サービスを起動する [ENV=dev|prod]"
    preconditions:
      - sh: test -f secrets/{{.ENV}}/secrets.enc.yaml
        msg: "secrets/{{.ENV}}/secrets.enc.yaml が見つかりません。task secrets:encrypt ENV={{.ENV}} を先に実行してください"
      - sh: test -f secrets/app_key.txt
        msg: "secrets/app_key.txt が見つかりません。task secrets:init を先に実行してください"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} up -d

  down:
    desc: "サービスを停止する [ENV=dev|prod]"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} down

  build:
    desc: "イメージをキャッシュなしでビルドする [ENV=dev|prod]"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} build --no-cache

  restart:
    desc: "全サービスを再起動する [ENV=dev|prod]"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} restart

  # ─── test ───────────────────────────────────────────────────────
  test:prepare:
    desc: "テストの事前準備を自動化する (冪等)"
    cmds:
      - |
        # age キーが未生成なら既存の secrets:init を使う
        if [ ! -f secrets/dev/key.txt ] || [ ! -f secrets/prod/key.txt ]; then
          task secrets:init
        fi
      - |
        # secrets.yaml が未作成なら example からコピー
        for env in dev prod; do
          if [ ! -f secrets/${env}/secrets.yaml ]; then
            cp secrets/${env}/secrets.yaml.example secrets/${env}/secrets.yaml
            echo "secrets/${env}/secrets.yaml を作成しました"
          fi
        done
      - |
        # secrets.enc.yaml が未作成なら既存の secrets:encrypt を使う
        for env in dev prod; do
          if [ ! -f secrets/${env}/secrets.enc.yaml ]; then
            task secrets:encrypt ENV=${env}
          fi
        done
      - task: down
      - task: up

  test:build:
    desc: "テストイメージをビルド"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE_TEST}} build test test-isolation

  test:
    desc: "テストを実行する (事前準備も自動で行う) [ENV=dev|prod]"
    cmds:
      - task: test:prepare
      - ENV={{.ENV}} {{.COMPOSE_TEST}} run --rm test
      - ENV={{.ENV}} {{.COMPOSE_TEST}} run --rm test-isolation

  test:all:
    desc: "dev と prod の両環境でテストを実行 (prod secrets が必要)"
    cmds:
      - echo "=== dev ==="
      - task: up
        vars: { ENV: dev }
      - task: test
        vars: { ENV: dev }
      - task: down
        vars: { ENV: dev }
      - echo "=== prod ==="
      - task: up
        vars: { ENV: prod }
      - task: test
        vars: { ENV: prod }
      - task: down
        vars: { ENV: prod }

  # ─── lifecycle ──────────────────────────────────────────────────
  ps:
    desc: "サービスの状態を表示する [ENV=dev|prod]"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} ps

  logs:
    desc: "ログを追跡する [ENV=dev|prod] [SVCNAME=<service>]"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} logs -f {{.SVCNAME}}

  # ─── reset ──────────────────────────────────────────────────────
  reset:
    desc: "ボリュームを削除して再ビルド・起動する [ENV=dev|prod]"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} down -v
      - task: build
      - task: up

  clean:
    desc: "コンテナ・ネットワーク・ボリュームを全て削除する [ENV=dev|prod]"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} down -v --remove-orphans

  # ─── db ─────────────────────────────────────────────────────────
  db:shell:
    desc: "MySQL シェルを開く [ENV=dev|prod]"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} exec db sh -c 'mysql -u app -p$(cat /run/decrypted/DB_PASSWORD) app_db'

  db:dump:
    desc: "DB を標準出力にダンプする [ENV=dev|prod]"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} exec db sh -c 'mysqldump -u app -p$(cat /run/decrypted/DB_PASSWORD) app_db'

  # ─── app ────────────────────────────────────────────────────────
  app:shell:
    desc: "app コンテナのシェルを開く [ENV=dev|prod]"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} exec app sh

  # ─── secrets ────────────────────────────────────────────────────
  secrets:init:
    desc: "dev/prod の age キーペアと app_key を生成し .sops.yaml を自動更新する"
    cmds:
      - mkdir -p secrets/dev secrets/prod
      - age-keygen -o secrets/dev/key.txt
      - age-keygen -o secrets/prod/key.txt
      - sh -c 'head -c 32 /dev/urandom | base64 > secrets/app_key.txt'
      - |
        dev_key=$(grep "^# public key:" secrets/dev/key.txt | cut -d' ' -f4)
        prod_key=$(grep "^# public key:" secrets/prod/key.txt | cut -d' ' -f4)
        cat > .sops.yaml << SOPS_EOF
        creation_rules:
          - path_regex: secrets/dev/secrets\\.yaml\$
            age: >-
              ${dev_key}
          - path_regex: secrets/prod/secrets\\.yaml\$
            age: >-
              ${prod_key}
        SOPS_EOF
        echo ".sops.yaml を更新しました"
        echo "dev  公開鍵: ${dev_key}"
        echo "prod 公開鍵: ${prod_key}"
        echo "app_key.txt を生成しました"

  secrets:encrypt:
    desc: "secrets.yaml を暗号化して secrets.enc.yaml を生成する [ENV=dev|prod]"
    cmds:
      - sops -e secrets/{{.ENV}}/secrets.yaml > secrets/{{.ENV}}/secrets.enc.yaml
      - echo "secrets/{{.ENV}}/secrets.enc.yaml を生成しました"

  secrets:decrypt:
    desc: "シークレットを復号して表示する [ENV=dev|prod]"
    cmds:
      - SOPS_AGE_KEY_FILE=secrets/{{.ENV}}/key.txt sops -d secrets/{{.ENV}}/secrets.enc.yaml

  secrets:edit:
    desc: "暗号化ファイルをエディタで直接編集する [ENV=dev|prod]"
    cmds:
      - SOPS_AGE_KEY_FILE=secrets/{{.ENV}}/key.txt sops secrets/{{.ENV}}/secrets.enc.yaml

  # ─── api ────────────────────────────────────────────────────────
  api:health:
    desc: "GET /health (Docker secrets の確認も含む)"
    cmds:
      - curl -s http://localhost:{{.WEB_PORT}}/health | jq .

  api:list:
    desc: "GET /todos (2回目以降はValkeyキャッシュから返る)"
    cmds:
      - curl -s http://localhost:{{.WEB_PORT}}/todos | jq .

  api:create:
    desc: "Todo を作成する [TITLE='タスク名']"
    vars:
      TITLE: '{{.TITLE | default "sample todo"}}'
    cmds:
      - |
        curl -s -X POST http://localhost:{{.WEB_PORT}}/todos \
          -H "Content-Type: application/json" \
          -d "{\"title\":\"{{.TITLE}}\"}" | jq .

  api:delete:
    desc: "Todo を削除する [ID=1]"
    cmds:
      - curl -s -o /dev/null -w "HTTP %{http_code}\n" -X DELETE http://localhost:{{.WEB_PORT}}/todos/{{.ID}}

  api:bench:
    desc: "キャッシュなし vs あり のレスポンス時間を比較"
    cmds:
      - |
        ENV={{.ENV}} {{.COMPOSE}} exec cache valkey-cli DEL todos > /dev/null
        echo "--- 1回目: DB直接取得 (キャッシュなし) ---"
        time curl -s http://localhost:{{.WEB_PORT}}/todos > /dev/null
        echo "--- 2回目: Valkeyキャッシュ ---"
        time curl -s http://localhost:{{.WEB_PORT}}/todos > /dev/null

  # ─── cache ──────────────────────────────────────────────────────
  cache:keys:
    desc: "Valkeyの全キーを表示"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} exec cache valkey-cli KEYS '*'

  cache:get:
    desc: "Valkeyのキーを取得 [KEY=todos]"
    vars:
      KEY: '{{.KEY | default "todos"}}'
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} exec cache valkey-cli GET {{.KEY}}

  cache:flush:
    desc: "Valkeyのキャッシュを全削除"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} exec cache valkey-cli FLUSHALL

  cache:monitor:
    desc: "Valkeyへのコマンドをリアルタイム監視"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} exec cache valkey-cli MONITOR

  # ─── inspect ────────────────────────────────────────────────────
  inspect:networks:
    desc: "frontendとbackendネットワークの詳細を表示"
    cmds:
      - docker network inspect php-todo_frontend php-todo_backend

  inspect:secrets:
    desc: "コンテナ内のsecrets/decryptedファイルを確認"
    cmds:
      - |
        echo "=== Docker native secret: /run/secrets/app_key ==="
        ENV={{.ENV}} {{.COMPOSE}} exec app cat /run/secrets/app_key
        echo ""
        echo "=== SOPS decrypted: /run/decrypted/DB_PASSWORD ==="
        ENV={{.ENV}} {{.COMPOSE}} exec app cat /run/decrypted/DB_PASSWORD

  inspect:config:
    desc: "コンテナにマウントされたnginx.confを確認"
    cmds:
      - ENV={{.ENV}} {{.COMPOSE}} exec web cat /etc/nginx/conf.d/default.conf
