name: php-todo

services:
  sops-init:
    build:
      context: ./sops
    volumes:
      - ./secrets/${ENV:-dev}/secrets.enc.yaml:/secrets/secrets.enc.yaml:ro
      - ./secrets/${ENV:-dev}/key.txt:/age/key.txt:ro
      - decrypted:/run/output
    environment:
      SOPS_AGE_KEY_FILE: /age/key.txt

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ./app
    secrets:
      - app_key
    volumes:
      - decrypted:/run/decrypted:ro
    networks:
      - frontend
      - backend
    depends_on:
      sops-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: mysql:9.3
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - decrypted:/run/decrypted:ro
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app
      MYSQL_PASSWORD_FILE: /run/decrypted/DB_PASSWORD
      MYSQL_ROOT_PASSWORD_FILE: /run/decrypted/DB_ROOT_PASSWORD
    networks:
      - backend
    depends_on:
      sops-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cache:
    image: valkey/valkey:8.1-alpine
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  frontend:
  backend:

volumes:
  db-data:
  decrypted:
    # Linux本番環境では以下を有効化してメモリ上のみに保持
    # driver_opts:
    #   type: tmpfs
    #   device: tmpfs

secrets:
  app_key:
    file: ./secrets/app_key.txt

configs:
  nginx_conf:
    file: ./web/nginx.conf
